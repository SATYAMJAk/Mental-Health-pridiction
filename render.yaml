services:
  # 1. Python FastAPI ML Microservice
  - type: web
    name: student-mental-health-ml
    runtime: python
    rootDir: ml_service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  # 2. Node.js Express Backend API
  - type: web
    name: student-mental-health-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: student-mental-health-ml
          property: host
      - key: PORT
        value: 10000

  # 3. React (Vite) Frontend Web Portal
  - type: web
    name: student-mental-health-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
